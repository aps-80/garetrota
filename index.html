        html += '</div>';
      }

  }, '', 'Stampa biglietti');

function numeroInLettere(n){
  const u = ['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'];
  const d = ['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
  n = Math.floor(n);
  if(n < 20) return u[n];
  if(n < 100){ const t = d[Math.floor(n/10)], r = n%10; if(!r) return t; return (r===1||r===8 ? t.slice(0,-1) : t) + (r===3 ? 'tré' : u[r]); }
  if(n < 1000){ const c = Math.floor(n/100), r = n%100; return (c===1?'cento':u[c]+'cento') + (r ? numeroInLettere(r) : ''); }
  return String(n);
}

function proposteStagione(){ return S.settings.proposte || (S.settings.proposte = {}); }
function piuGiorni(iso, n){ const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoDate(d); }
const TESTO_COPPIE_PROPOSTA = 'GARA A COPPIE UN SOCIO E UN __NON SOCIO__,\nCON __LOTTERIA E PREMIAZIONE__';
// proposta iniziale: le gare già inserite per quell'anno, altrimenti quelle dell'anno prima spostate di 52 settimane (stesso giorno della settimana); la 2ª data è la domenica dopo
function propostaIniziale(y){
  const di = a => S.gare.filter(g=>annoGara(g)===a).sort((p,q)=>p.data.localeCompare(q.data));
  let base = di(y).map(g=>({a:g.data, ora:g.orario||'', formato:g.formato}));
  if(!base.length) base = di(y-1).map(g=>({a:piuGiorni(g.data,364), ora:g.orario||'', formato:g.formato}));
  const righe = base.map(r=>({a:r.a, b:piuGiorni(r.a,7), ora:r.ora||'08:00', formato:r.formato==='coppie'?'coppie':'individuale', testo:r.formato==='coppie'?TESTO_COPPIE_PROPOSTA:'', scelta:''}));
  return {prezzo:S.settings.prezzoKg, righe, fondo:''};
}
function propostaDi(y){ const p = proposteStagione()[y]; return p ? JSON.parse(JSON.stringify(p)) : propostaIniziale(y); }
function fondoProposta(p){
  if(p.fondo) return p.fondo;
  const camp = p.righe.filter(r=>r.formato!=='coppie').length, cop = p.righe.filter(r=>r.formato==='coppie');
  const mese = r => { const d = [r.a, r.b].filter(Boolean).sort()[0]; return d ? ' '+MESI[+d.slice(5,7)-1] : ''; };
  return `N ${camp} GARE CAMPIONATO` + cop.map(r=>`\nN 1 GARA${mese(r)} A COPPIE CON CAPANNONE`).join('');
}

    <div class="pfondo">${esc(fondoProposta(p)).replace(/\n/g,'<br>')}</div></div>`;
}

function leggiPropostaForm(f){
  const p = {prezzo: f.prezzo.value==='' ? '' : +f.prezzo.value, fondo: '', righe: []};
  f.querySelectorAll('#propRighe tr[data-i]').forEach(tr=>{
    const i = tr.dataset.i, v = n => f[n+'_'+i] ? f[n+'_'+i].value : '';
    const sc = f.querySelector(`input[name="scelta_${i}"]:checked`);
    p.righe.push({a:v('a'), b:v('b'), ora:v('ora'), formato:v('formato'), testo:v('testo'), scelta:sc?sc.value:''});
  });
  p.righe.sort((x,y)=>([x.a,x.b].filter(Boolean).sort()[0]||'9').localeCompare([y.a,y.b].filter(Boolean).sort()[0]||'9'));
  // le righe in fondo restano automatiche (si aggiornano col numero di gare) finché non vengono cambiate a mano
  const t = f.fondo.value.trim();
  if(t !== fondoProposta(p) && t !== f.fondo.dataset.auto) p.fondo = t;
  return p;
}

  }, '<button type="button" class="btn" onclick="creaGareProposta()">Crea le gare</button>', 'Stampa foglio');
  $('#dlgForm').dataset.anno = y;

// annulla una volta sola il "Crea le gare" premuto per sbaglio il 16/10/2026 sulle stagioni 2026 e 2027:
// toglie le gare 2026 create vuote e rimette le gare 2027 alle date del calendario
function ripristinaGareProposta(){
  let n = 0;
  const extra2026 = ['2026-03-01','2026-05-10','2026-09-13','2026-10-25'];
  S.gare = S.gare.filter(g=>{
    const via = extra2026.indexOf(g.data)>=0 && !garaIniziata(g) && !g.iscritti.some(e=>e.pesato||e.pagato) && !CALENDARIO_2026.includes(g.data);
    if(via) n++; return !via;
  });
  const usate = new Set();
  CALENDARIO_2027.split('\n').forEach(l=>{
    const p = l.split(';');
    if(S.gare.some(g=>g.data===p[0])){ usate.add(S.gare.find(g=>g.data===p[0])); return; }
    const g = S.gare.find(x=>!usate.has(x) && x.data.slice(0,7)===p[0].slice(0,7) && x.formato===p[2] && !garaIniziata(x));
    if(!g) return;
    usate.add(g); g.data = p[0]; g.orario = p[1]; if(g.nomeAuto) g.nome = nomeAutomatico(g); n++;
  });
  // le proposte restano, ma senza le scelte segnate; quelle delle stagioni passate si tolgono
  const pr = proposteStagione();
  Object.keys(pr).forEach(y=>{ if(+y <= 2026) delete pr[y]; else (pr[y].righe||[]).forEach(r=>{ r.scelta = ''; }); });
  S.settings.ripristinoGareProposta = true; save();
  return n;
}
function creaGareProposta(){
  const f = $('#dlgForm'), y = +f.anno.value, p = salvaPropostaForm(f);
  const righe = p.righe.filter(r=>r.a||r.b);
  const manca = righe.filter(r=>!r.scelta || !r[r.scelta]);
  if(!righe.length){ alert('Non ci sono gare nella proposta.'); return; }
  if(S.gare.some(g=>annoGara(g)===y && garaIniziata(g))){ alert(`La stagione ${y} è già cominciata: le gare non si possono più creare da qui. Per cambiare una data apri la singola gara.`); return; }
  if(manca.length){ alert(`Segna la data scelta (1ª o 2ª) per tutte le gare: ne mancano ${manca.length}.`); return; }
  const elenco = righe.map(r=>`- ${dataEstesa(r[r.scelta])} ore ${r.ora}${r.formato==='coppie'?' (a coppie)':''}`).join('\n');
  if(!confirm(`Le gare ${y} diventeranno queste:\n\n${elenco}\n\nPrezzo al kg: ${fmtDec2(+p.prezzo||0)} €\n\nConfermi?`)) return;
  const prezzo = p.prezzo==='' ? '' : +p.prezzo, usate = new Set();
  let nuove = 0, aggiornate = 0, ferme = 0;
  righe.forEach(r=>{
    const data = r[r.scelta], mese = data.slice(0,7);
    // si aggiorna la gara già in calendario lo stesso giorno, oppure nello stesso mese e dello stesso tipo, se non è ancora iniziata
    let g = S.gare.find(x=>x.data===data && !usate.has(x)) || S.gare.find(x=>x.data.slice(0,7)===mese && x.formato===r.formato && !usate.has(x));
    if(g && garaIniziata(g)){ if(g.data===data){ usate.add(g); ferme++; return; } g = null; }
    if(g){
      if(g.formato !== r.formato) g.limiteTrote = limiteIniziale(y, r.formato);
      usate.add(g); g.data = data; g.orario = r.ora; g.formato = r.formato; g.valeGenerale = r.formato!=='coppie';
      if(r.formato==='coppie' && !g.testoLettera) g.testoLettera = TESTO_COPPIE;
      if(g.nomeAuto) g.nome = nomeAutomatico(g);
      aggiornate++;
    } else {
      g = {id:uid(), data, orario:r.ora, formato:r.formato, campo:CAMPO_DEFAULT, valeGenerale:r.formato!=='coppie', limiteTrote:limiteIniziale(y, r.formato),
        note: r.formato==='coppie' ? 'Gara a coppie: un socio e un non socio.' : '', testoLettera: r.formato==='coppie' ? TESTO_COPPIE : '', iscritti:[], borse:{}, nomeAuto:true};
      g.nome = nomeAutomatico(g); S.gare.push(g); usate.add(g); nuove++;
    }
    // il prezzo concordato col lago vale per le gare di questa stagione, senza toccare quelle dell'anno in corso
    g.prezzoKg = (prezzo==='' || prezzo===+S.settings.prezzoKg) ? '' : prezzo;
  });
  save(); closeDlg(); render();
  toast(`Gare ${y}: ${nuove} nuove, ${aggiornate} aggiornate${ferme?`, ${ferme} già iniziate lasciate com'erano`:''}`);
}

// testo a righe: "= " centrata, "## " grande e centrata, "> " a destra, riga vuota = spazio; **grassetto**, __sottolineato__
function htmlRighe(testo, val){
  const fill = s => s.replace(/\{(\w+)\}/g, (m,k)=> val[k]!==undefined ? val[k] : m);
  return esc(testo).split('\n').map(l=>{
    let cls = 'r';
    if(l.indexOf('## ')===0){ cls = 'r gr'; l = l.slice(3); }
    else if(l.indexOf('= ')===0){ cls = 'r cen'; l = l.slice(2); }
    else if(l.indexOf('&gt; ')===0){ cls = 'r des'; l = l.slice(5); }
    if(!l.trim()) return '<div class="vuota"></div>';
    return `<div class="${cls}">${markup(fill(l))}</div>`;
  }).join('');
}
function giornoEsteso(iso){ if(!iso) return ''; const g = GIORNI[new Date(iso+'T12:00').getDay()].replace('’',''); return g.charAt(0)+g.slice(1).toLowerCase()+' '+dataEstesa(iso); }
function dataLettera(iso){ if(!iso) return ''; const p = iso.split('-'), m = MESI[+p[1]-1]; return `${+p[2]} ${m.charAt(0)+m.slice(1).toLowerCase()} ${p[0]}`; }
// sabato dopo l'ultima gara della stagione
function sabatoDopo(iso){ const d = new Date(iso+'T12:00'); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); return isoDate(d); }
function ultimaGaraStagione(y){ const g = S.gare.filter(x=>annoGara(x)===y).sort((a,b)=>b.data.localeCompare(a.data))[0]; return g ? g.data : y+'-11-15'; }
function righeContatti(t){ return `<table class="cont">${String(t||'').split('\n').filter(x=>x.trim()).map(r=>{ const p = r.split('|'); return `<tr><td>${esc(p[0].trim())}</td><td>${esc((p[1]||'').trim())}</td></tr>`; }).join('')}</table>`; }

const AUGURI_MODELLO = `{luogo_data}

// immaginetta di Natale disegnata (bianco e nero, si stampa bene anche in fotocopia):
// albero con puntale, palline e festone, regali ai piedi e fiocchi di neve
function svgNatale(){
  const f = n => n.toFixed(1);
  const stella = (x,y,r) => { let p = ''; for(let i=0;i<10;i++){ const a = Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*0.42 : r; p += (i?'L':'M')+f(x+rr*Math.cos(a))+' '+f(y-rr*Math.sin(a)); } return p+'Z'; };
  // un piano dell'albero: lati leggermente curvi e bordo in basso a festoni
  const piano = (top, yb, half) => { const xl = 100-half, xr = 100+half, n = Math.round(half/14), w = (xr-xl)/n;
    let d = `M100 ${top} Q${f(100-half*0.42)} ${f((top+yb)/2+5)} ${xl} ${yb}`;
    for(let i=0;i<n;i++){ const x0 = xl+i*w; d += ` Q${f(x0+w/2)} ${yb+10} ${f(x0+w)} ${yb}`; }
    return `<path d="${d} Q${f(100+half*0.42)} ${f((top+yb)/2+5)} 100 ${top}Z" fill="#fff" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>`; };
  const pallina = (x,y,r,piena) => `<line x1="${x}" y1="${y-r-3}" x2="${x}" y2="${y-r}" stroke="#000" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="${r}" fill="${piena?'#000':'#fff'}" stroke="#000" stroke-width="1.8"/>${piena?`<path d="M${f(x-r*0.45)} ${f(y-r*0.25)} q${f(r*0.25)} ${f(-r*0.4)} ${f(r*0.6)} ${f(-r*0.45)}" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/>`:`<path d="M${x-r} ${y} h${2*r}" stroke="#000" stroke-width="1.2"/>`}`;
  const fiocco = (x,y,r) => { let p = ''; for(let k=0;k<3;k++){ const a = k*Math.PI/3, dx = r*Math.cos(a), dy = r*Math.sin(a); p += `M${f(x-dx)} ${f(y-dy)}L${f(x+dx)} ${f(y+dy)}`; }
    for(let k=0;k<6;k++){ const a = k*Math.PI/3, ex = x+r*0.62*Math.cos(a), ey = y+r*0.62*Math.sin(a), b1 = a+2.4, b2 = a-2.4; p += `M${f(ex)} ${f(ey)}l${f(r*0.3*Math.cos(b1))} ${f(r*0.3*Math.sin(b1))}M${f(ex)} ${f(ey)}l${f(r*0.3*Math.cos(b2))} ${f(r*0.3*Math.sin(b2))}`; }
    return `<path d="${p}" stroke="#000" stroke-width="1.3" stroke-linecap="round" fill="none"/>`; };
  const regalo = (x,y,w,h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="#000" stroke-width="2.2"/><rect x="${x-2}" y="${y}" width="${w+4}" height="7" fill="#fff" stroke="#000" stroke-width="2.2"/>
    <rect x="${x+w/2-3}" y="${y}" width="6" height="${h}" fill="#000"/>
    <path d="M${x+w/2} ${y} c-12 -12 -18 -2 -10 2 z M${x+w/2} ${y} c12 -12 18 -2 10 2 z" fill="#fff" stroke="#000" stroke-width="2"/>`;
  const perle = d => `<path d="${d}" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 6"/>`;
  return `<svg class="natale" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
    ${fiocco(22,40,9)}${fiocco(178,30,8)}${fiocco(168,96,6)}${fiocco(30,108,6)}${fiocco(186,150,5)}${fiocco(12,160,5)}
    <rect x="91" y="165" width="18" height="20" fill="#fff" stroke="#000" stroke-width="2.4"/>
    ${piano(92,165,64)}${perle('M52 156 Q100 132 150 146')}${pallina(62,170-10,5,true)}${pallina(90,150,5.5,false)}${pallina(118,156,5,true)}${pallina(140,166-6,5,false)}${pallina(100,140,4.5,true)}
    ${piano(58,124,48)}${perle('M64 116 Q100 98 136 108')}${pallina(74,118,4.5,false)}${pallina(100,104,5,true)}${pallina(126,114,4.5,false)}${pallina(82,102,4,true)}
    ${piano(30,82,32)}${perle('M78 76 Q100 64 122 70')}${pallina(88,77,4,true)}${pallina(112,72,4,false)}
    <path d="${stella(100,22,15)}" fill="#000" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M100 2 v-0 M79 10 l-6 -4 M121 10 l6 -4 M77 28 l-7 2 M123 28 l7 2" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
    ${regalo(46,176,34,26)}${regalo(122,182,30,20)}${regalo(84,188,24,14)}
    <path d="M24 203 Q60 198 100 203 T176 203" fill="none" stroke="#000" stroke-width="1.8"/>
  </svg>`;
}

function problemiCartelle(){

// casella che fa le somme: "100+25+36,50-10" fa 151,50 (virgola o punto per i decimali)
function numeroIt(p){
  if(p.indexOf(',')>=0) p = p.replace(/\./g,'').replace(',','.');
  else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(p)) p = p.replace(/\./g,'');
  return Number(p);
}
function calcolaSomma(t){
  // un + lasciato in fondo non conta
  const s = String(t||'').replace(/\s/g,'').replace(/[-+]+$/,'');
  if(!s) return 0;
  if(!/^[-+]?[\d.,]+([-+][\d.,]+)*$/.test(s)) return NaN;
  return Math.round(s.match(/[-+]?[\d.,]+/g).reduce((a,p)=>a + numeroIt(p), 0) * 100) / 100;
}
function campoSomma(val, onchange, largo){

}

function esitoSomma(t){ t = String(t||'').trim(); if(!/\d\s*[-+]/.test(t)) return /^[\d.,\s]*$/.test(t) ? '' : 'da correggere'; const n = calcolaSomma(t); return isNaN(n) ? 'da correggere' : '= € ' + fmtDec2(n); }

function piuSomma(b){ const i = b.parentNode.querySelector('input'); if(i.value.trim() && !/[+]$/.test(i.value.trim())) i.value = i.value.trim() + '+'; i.focus(); mostraSomma(i); }

function ordineVincite(){

/* .xlsx scritto senza librerie esterne (zip senza compressione) */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files, mime){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true);
    h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true);
    c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true);
    c.setUint32(42,offset,true);
    central.push(c.buffer, name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((a,b)=>a+b.byteLength,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,offset,true);
  return new Blob(parts.concat(central, [e.buffer]), {type:mime});
}
function colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function xEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''); }
function makeXlsx(sheets){
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const files = [];
  sheets.forEach((sh, si)=>{
    const widths = [];
    sh.rows.forEach(r=>{ if(r.length<3) return; r.forEach((v,ci)=>{ const len = String(v && typeof v==='object' ? v.v : (v==null?'':v)).length; widths[ci] = Math.max(widths[ci]||8, Math.min(len+2, 50)); }); });
    let x = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}">`;
    if(widths.length) x += '<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w||8}" customWidth="1"/>`).join('')+'</cols>';
    x += '<sheetData>';
    sh.rows.forEach((r,ri)=>{
      x += `<row r="${ri+1}">`;
      r.forEach((v,ci)=>{
        let st = (sh.bold||[]).indexOf(ri)>=0 ? 1 : 0;
        if(v && typeof v==='object'){ st = v.s; v = v.v; }
        if(v===null || v===undefined || v==='') return;
        const ref = colName(ci)+(ri+1), sa = st ? ` s="${st}"` : '';
        if(typeof v==='number' && isFinite(v)) x += `<c r="${ref}"${sa}><v>${v}</v></c>`;
        else x += `<c r="${ref}" t="inlineStr"${sa}><is><t xml:space="preserve">${xEsc(v)}</t></is></c>`;
      });
      x += '</row>';
    });
    x += '</sheetData><pageSetup orientation="portrait" paperSize="9"/></worksheet>';
    files.push({name:`xl/worksheets/sheet${si+1}.xml`, data:x});
  });
  const sheetName = n => n.replace(/[\[\]:*?\/\\]/g,'').slice(0,31) || 'Foglio';
  files.push({name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`});
  files.push({name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RNS}/officeDocument" Target="xl/workbook.xml"/></Relationships>`});
  files.push({name:'xl/workbook.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets>${sheets.map((s,i)=>`<sheet name="${xEsc(sheetName(s.name))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`});
  files.push({name:'xl/_rels/workbook.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${RNS}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${RNS}/styles" Target="styles.xml"/></Relationships>`});
  files.push({name:'xl/styles.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.000"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  return makeZip(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function caricaLogo(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const sc = Math.min(1, 800/img.height), c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    S.settings.logo = c.toDataURL('image/png'); save(); render(); toast('Logo aggiornato');
  }; img.src = r.result; };
  r.readAsDataURL(f);
}

// bilancio per gara e per stagione, partendo dalla cassa iniziale della stagione (S.settings.cassaIniziale[anno])
// vista: 'bilancio' oppure 'fornitori' (pulsante "Vedi fornitori")
const amm = {anno:null, vista:'bilancio'};
// cassa iniziale: quella scritta a mano per la stagione (es. 2026, con i dati incompleti), altrimenti la cassa finale della stagione prima
function cassaManuale(y){ const v = (S.settings.cassaIniziale || {})[y]; return v!=null && v!=='' ? +v : null; }
function cassaIniziale(y){
  const m = cassaManuale(y); if(m!=null) return m;
  const prima = y - 1, c = S.settings.cassaIniziale || {};
  // si risale solo finché ci sono gare o casse scritte a mano negli anni prima
  if(!S.gare.some(g=>annoGara(g)<=prima) && !Object.keys(c).some(k=>+k<=prima)) return 0;
  return bilancioStagione(prima).fine;
}
function setCassaIniziale(y, val){
  const s = String(val).trim(), n = Number(s.replace(/\./g,'').replace(',','.'));
  if(s && isNaN(n)){ alert('Scrivi una cifra, per esempio 1500 oppure 1500,50.'); render(); return; }
  S.settings.cassaIniziale = S.settings.cassaIniziale || {};
  if(!s) delete S.settings.cassaIniziale[y]; else S.settings.cassaIniziale[y] = Math.round(n*100)/100;
  save(); render(); toast('Cassa iniziale ' + y + ': € ' + fmtDec2(cassaIniziale(y)));
}
// righe del bilancio che non sono gare: quote sociali pagate fuori gara (una riga per giorno) e cena sociale
function movimento(c){ return Object.assign({qGara:0, qSoci:0, iscrizioni:0, ricaviSec:0, costo:0, premi:0, costiSec:0, persone:0, pagPers:0}, c); }
function altriMovimenti(y){
  const giorni = {};
  S.soci.forEach(s=>{ const q = s.quoteFuoriGara && s.quoteFuoriGara[y]; if(!q) return;
    (giorni[q.data] = giorni[q.data] || []).push({s, euro:+q.euro || 0}); });
  const out = Object.keys(giorni).map(data=>{ const l = giorni[data], tot = l.reduce((a,x)=>a+x.euro, 0);
    return {data, nome:(l.length===1 ? 'Quota sociale pagata fuori gara: ' : 'Quote sociali pagate fuori gara: ') + l.map(x=>nome(x.s)).join(', '), c:movimento({qSoci:tot, iscrizioni:l.length, totale:tot})}; });
  const cn = contiCena(y);
  if(cn) out.push({data:cn.data, nome:`Cena sociale (${cn.persone} persone, ${cn.nonPaganti} non paganti)`, cena:true, c:movimento({ricaviSec:cn.ricavi, costiSec:cn.costi, totale:cn.ricavi - cn.costi})});
  return out;

function bilancioStagione(y){
  const ini = cassaIniziale(y);
  let cassa = ini;
  const gare = S.gare.filter(g=>annoGara(g)===y).map(g=>({g, data:g.data, nome:g.nome, c:contiGara(g), fatta:g.iscritti.some(e=>e.pesato || e.pagato)}));
  const righe = gare.concat(altriMovimenti(y).map(x=>Object.assign({fatta:true}, x))).sort((a,b)=>a.data.localeCompare(b.data)).map(x=>{
    cassa += x.c.totale;
    return Object.assign(x, {cassa});
  });
  const somma = k => righe.reduce((a,x)=>a + x.c[k], 0);
  const t = {qGara:somma('qGara'), qSoci:somma('qSoci'), costo:somma('costo'), premi:somma('premi'), costiSec:somma('costiSec'), ricaviSec:somma('ricaviSec'), totale:somma('totale'), persone:somma('persone'), iscrizioni:somma('iscrizioni')};
  t.entrate = t.qGara + t.qSoci + t.ricaviSec; t.uscite = t.costo + t.premi + t.costiSec;
  return {ini, righe, t, fine: ini + t.totale};
}

      if(!fatta) return `<tr class="inactive"><td>${fmtDate(data)}</td><td>${esc(nome)} <span class="muted small">da disputare</span></td><td colspan="10"></td></tr>`;
      // le righe che non sono gare (quote fuori gara, cena) mostrano solo le cifre che hanno
      return `<tr${g ? '' : ' class="movim"'}><td>${fmtDate(data)}</td><td>${g ? esc(nome) : '<i>' + esc(nome) + '</i>'}${g && c.pagPers < c.persone ? ` <span class="badge warn">${c.persone - c.pagPers===1 ? 'manca 1 pagamento' : 'mancano ' + (c.persone - c.pagPers) + ' pagamenti'}</span>` : ''}</td>
      <td class="num">${g ? c.persone : ''}</td><td class="num">${g ? e(c.qGara) : ''}</td><td class="num">${g || c.iscrizioni ? c.iscrizioni : ''}</td><td class="num">${g ? e(c.qSoci) : v(c.qSoci)}</td><td class="num">${v(c.ricaviSec)}</td><td class="num">${g ? e(c.costo) : ''}</td><td class="num">${v(c.premi)}</td><td class="num">${v(c.costiSec)}</td>
      <td class="num"${neg(c.totale)}><b>${e(c.totale)}</b></td><td class="num">${e(cassa)}</td></tr>`; }).join('')}
    <tr class="tot" style="font-weight:700"><td></td><td>Totale stagione</td><td class="num">${b.t.persone}</td><td class="num">${e(b.t.qGara)}</td><td class="num">${b.t.iscrizioni}</td><td class="num">${e(b.t.qSoci)}</td><td class="num">${e(b.t.ricaviSec)}</td><td class="num">${e(b.t.costo)}</td><td class="num">${e(b.t.premi)}</td><td class="num">${e(b.t.costiSec)}</td><td class="num"${neg(b.t.totale)}>${e(b.t.totale)}</td><td class="num">${e(b.fine)}</td></tr>
    </tbody></table>`;
}
function riassuntoBilancio(b, y, cl){
  const cena = b.righe.some(x=>x.cena) ? ' e cena' : '';
  // in stampa una riga sola sotto la tabella, per stare in un foglio
  if(cl==='riass'){ const v = [['Cassa iniziale', b.ini], ['+ Quote gara', b.t.qGara], ['+ Quote soci (' + b.t.iscrizioni + ' soci)', b.t.qSoci], ['+ Ricavi secondari' + cena, b.t.ricaviSec], ['- Costo trote', b.t.costo], ['- Premi', b.t.premi], ['- Costi secondari' + cena, b.t.costiSec], ['= Risultato stagione', b.t.totale], ['Cassa finale ' + y, b.fine]];
    return `<table class="riass"><tr>${v.map(x=>`<th>${x[0]}</th>`).join('')}</tr><tr>${v.map((x,i)=>`<td class="num"${i>=v.length-2?' style="font-weight:700"':''}>€ ${fmtDec2(x[1])}</td>`).join('')}</tr></table>`; }
  const r = (k, v, tot) => `<tr${tot?' class="tot" style="font-weight:700"':''}><td>${k}</td><td class="num">${v}</td></tr>`, e = n => '€ ' + fmtDec2(n);
  return `<table class="${cl}">
    ${r('Cassa iniziale ' + y, e(b.ini))}
    ${r('Entrate: quote gara', '+ ' + e(b.t.qGara))}
    ${r('Entrate: quote soci (' + b.t.iscrizioni + ' soci paganti)', '+ ' + e(b.t.qSoci))}
    ${r('Entrate: ricavi secondari' + cena, '+ ' + e(b.t.ricaviSec))}
    ${r('Uscite: costo trote', '- ' + e(b.t.costo))}
    ${r('Uscite: premi', '- ' + e(b.t.premi))}
    ${r('Uscite: costi secondari' + cena, '- ' + e(b.t.costiSec))}
    ${r('Risultato della stagione', e(b.t.totale), true)}
    ${r('Cassa finale ' + y, e(b.fine), true)}</table>`;
}

  const y = curYear();
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  cogn.forEach((c,i)=>S.soci.push({id:uid(), numero:i+1, cognome:c, nome:nomi[i], tipo:i%9===4?'pierino':'adulto', quotaAnno: i%6===3 ? y-1 : y, telefono:'', email:'', indirizzo:'', cap:'', citta:'', note:''}));

  date.forEach((d,gi)=>{

    sociAttivi().forEach((s,i)=>{ g.borse[s.id] = i+1; const e = newEntry(s.id, i+1); e.pagato = gi<5 && rnd()>0.15; g.iscritti.push(e); });
    if(gi<5) g.iscritti.forEach(e=>{ if(!e.pagato) return; const t = Math.floor(rnd()*9); e.trote = t; e.grammi = Math.round(t*(260+rnd()*220)); e.pesato = true; });

// service worker: l'app si apre anche senza internet (al campo).
// Con una nuova VERSIONE non si ricarica da sola (si perderebbe una pesata a metà):
// in alto compare "Nuova versione: Aggiorna" e si ricarica solo quando lo premi.
// memoria protetta: Chrome non cancella i dati dell'app quando il tablet ha poco spazio
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  let chiesto = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(chiesto){ chiesto = false; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r=>{
    const b = $('#btnNuova');
    const mostra = ()=>{ if(r.waiting && navigator.serviceWorker.controller) b.hidden = false; };
    b.onclick = ()=>{
      if(staiScrivendo() && !confirm('Hai una finestra aperta o dati non salvati: aggiornando li perdi. Aggiornare lo stesso?')) return;
      if(Sync.invia) Sync.invia();
      chiesto = true; r.waiting.postMessage('aggiorna');
    };
    mostra();
    r.addEventListener('updatefound', ()=>{ const n = r.installing; if(n) n.addEventListener('statechange', ()=>{ if(n.state==='installed') mostra(); }); });
    // controlla se c'è una versione nuova: quando torni sull'app e, sul PC dove la finestra resta sempre aperta, ogni 15 minuti
    const controlla = ()=>{ if(navigator.onLine) r.update().catch(()=>{}); };
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') controlla(); });
    window.addEventListener('focus', controlla);
    setInterval(controlla, 15*60*1000);
  }).catch(e=>console.warn('Service worker non registrato', e));
}

completaAvvio().then(updateStatus);
// aggiornamenti dei dati salvati: partono una volta sola, quando l'archivio è già caricato
async function completaAvvio(){
  if(completaAvvio.fatto) return;
  completaAvvio.fatto = true;
  // archivio vuoto: niente da aggiornare, i dati arrivano con "Ripristina da backup"
  if(!hasData(S)) return;
  if(!S.gare.length && !S.settings.calendario2026Importato) importaCalendario2026();
  if(!S.settings.calendario2027Importato && S.gare.length) importaCalendario2027();
  // dal foglio del calendario 2027: prezzo del lago corretto a mano da 6,30 a 6,50 €/kg (solo le gare 2027 non iniziate)
  if(!S.settings.prezzo2027Applicato && S.gare.length){
    S.gare.filter(g=>annoGara(g)===2027 && !garaIniziata(g) && (g.prezzoKg===''||g.prezzoKg==null)).forEach(g=>{ g.prezzoKg = 6.5; });
    const p27 = (S.settings.proposte||{})[2027]; if(p27) p27.prezzo = 6.5;
    S.settings.prezzo2027Applicato = true; save();
  }
  if(!S.settings.ripristinoGareProposta && S.gare.length){ const n = ripristinaGareProposta(); if(n) toast(`Calendario ripristinato (${n} correzioni)`); }
  attribuisciQuote2026();
  // 25/10/2026: le quote già segnate pagate fuori gara non aggiornavano "pagata fino all'anno", così il PC le vedeva non pagate
  if(!S.settings.quotaAnnoFuoriGara){
    S.soci.forEach(s=>Object.keys(s.quoteFuoriGara||{}).forEach(y=>{ if(!(+s.quotaAnno >= +y)) s.quotaAnno = +y; }));
    S.settings.quotaAnnoFuoriGara = true; save();
  }
  // 22/10/2026: i nomi scritti a mano nelle lettere di Natale diventano schede in "Fornitori e chi ci ospita" (Amministrazione)
  if(!S.settings.fornitoriImportati){
    S.fornitori = S.fornitori || [];
    [['fornitori','fornitore'], ['ospitanti','ospita']].forEach(([tipo, campo])=>{
      String((S.settings[tipo]||{}).elenco||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>{
        let f = S.fornitori.find(x=>x.nome.toLowerCase()===n.toLowerCase());
        if(!f){ f = {id:uid(), nome:n, fornitore:false, ospita:false}; S.fornitori.push(f); }
        f[campo] = true; });
      if(S.settings[tipo]) delete S.settings[tipo].elenco;
    });
    S.settings.fornitoriImportati = true; save();
  }
  // 21/10/2026: la gara a coppie ha 10 trote di limite (solo le gare a coppie non ancora disputate col limite della stagione)
  if(!S.settings.limiteCoppie10 && S.gare.length){
    S.gare.filter(g=>isCoppie(g) && !g.iscritti.some(e=>e.pesato) && (+g.limiteTrote===limiteStagione(annoGara(g)) || g.limiteTrote==='')).forEach(g=>{ g.limiteTrote = LIMITE_COPPIE; });
    S.settings.limiteCoppie10 = true; save();
  }
  render();
}
// 21/10/2026: con i risultati 2026 inseriti dai fogli le quote sociali 2026 risultavano già pagate, ma nessuna gara le contava.
// Ogni socio in regola per il 2026 senza un pagamento segnato paga la quota nella prima gara 2026 in cui ha pagato.
// Parte anche dopo "Ripristina da backup", se il backup non ha ancora la correzione.
// Seconda passata (flag quote2026Controllate): conta anche chi ha pagato una gara 2026 ma aveva la quota vuota nella scheda
// chi era in regola per il 2026 senza aver fatto gare l'ha pagata fuori gara,
// segnata alla data della prima gara 2026 (si cambia nella scheda del socio).
function attribuisciQuote2026(){
  if(S.settings.quote2026Controllate || !S.gare.length) return;
  const gare = S.gare.filter(g=>annoGara(g)===2026).sort((a,b)=>a.data.localeCompare(b.data));
  const segnati = new Set();
  gare.forEach(g=>g.iscritti.forEach(e=>{ if(e.pagato || e.soloQuota) (e.quotaSocioPagata||[]).forEach(x=>segnati.add(x.id)); }));
  S.soci.forEach(s=>{ if(s.quoteFuoriGara && s.quoteFuoriGara[2026]) segnati.add(s.id); });
  let n = 0, f = 0;
  gare.forEach(g=>g.iscritti.filter(e=>e.pagato && partecipa(e)).forEach(e=>membri(e).forEach(s=>{
    if(segnati.has(s.id)) return;
    e.quotaSocioPagata = e.quotaSocioPagata || [];
    e.quotaSocioPagata.push({id:s.id, prev: +s.quotaAnno>=2026 ? 2025 : (s.quotaAnno||'')});
    if(!(+s.quotaAnno>=2026)) s.quotaAnno = 2026;
    segnati.add(s.id); n++;
  })));
  if(gare.length) S.soci.forEach(s=>{ if(!s.eliminato && +s.quotaAnno>=2026 && !segnati.has(s.id)){ segnaQuotaFuoriGara(s, 2026, gare[0].data); f++; } });
  S.settings.quote2026Attribuite = S.settings.quote2026Controllate = true; save();
  if(n || f) toast(`Quote sociali 2026: ${n} assegnate alle gare in cui sono state pagate` + (f ? `, ${f} pagate fuori gara` : ''));
}
</script>

<script type="module">
// Sincronizzazione con Firebase: accesso con Google (le regole ammettono solo due email) e
// Firestore con la cache sul dispositivo, così al campo si lavora anche senza internet.
// Per ogni documento si confronta questo dispositivo, Firebase e l'ultima versione che avevano
// in comune ("base", salvata in localStorage): chi è cambiato vince; se sono cambiati tutti e due,
// vince questo dispositivo.
const SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const BKEY = 'gareTrota.sync.base';
function impronta(s){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0; i<s.length; i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1^c, 2654435761); h2 = Math.imul(h2^c, 1597334677); }
  h1 = Math.imul(h1^(h1>>>16), 2246822507) ^ Math.imul(h2^(h2>>>13), 3266489909);
  h2 = Math.imul(h2^(h2>>>16), 2246822507) ^ Math.imul(h1^(h1>>>13), 3266489909);
  return (h2>>>0).toString(36) + (h1>>>0).toString(36);
}
const imp = j => j==null ? null : impronta(j);
const impronte = m => Object.fromEntries(Object.entries(m).map(([k,v])=>[k, imp(v)]));

let cfg = null;
try{ cfg = (await import('./firebase-config.js')).firebaseConfig; }catch(e){ console.warn('firebase-config.js non caricato', e); }
if(!cfg || !cfg.apiKey){ Sync.msg = 'Firebase non è configurato: i dati restano su questo dispositivo.'; updateSync(); }
else avvia();

async function avvia(){
  let A, Au, F;
  Sync.stato = 'avvio'; updateSync();
  try{ [A, Au, F] = await Promise.all([import(SDK+'firebase-app.js'), import(SDK+'firebase-auth.js'), import(SDK+'firebase-firestore.js')]); }
  catch(e){
    console.warn(e);
    Sync.stato = 'fuori'; Sync.msg = 'Firebase non si carica (manca internet?): lavori sui dati di questo dispositivo.';
    Sync.accedi = ()=>alert('Serve internet per collegarsi a Firebase.');
    updateSync(); addEventListener('online', avvia, {once:true}); return;
  }
  const app = A.initializeApp(cfg);
  let db;
  try{ db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch(e){ console.warn('Cache offline non disponibile', e); db = F.getFirestore(app); }
  // per le prove: Sync.rete(false) stacca Firestore dalla rete come al campo, anche dopo il ricaricamento della pagina
  Sync.rete = on=>{ try{ on ? sessionStorage.removeItem('gareTrota.senzaRete') : sessionStorage.setItem('gareTrota.senzaRete', '1'); }catch(e){} return on ? F.enableNetwork(db) : F.disableNetwork(db); };
  try{ if(sessionStorage.getItem('gareTrota.senzaRete')) F.disableNetwork(db); }catch(e){}
  const auth = Au.getAuth(app);
  const google = new Au.GoogleAuthProvider();
  google.setCustomParameters({prompt: 'select_account'});

  Sync.accedi = async ()=>{
    if(!navigator.onLine){ alert('Serve internet per accedere con Google.'); return; }
    try{ await Au.signInWithPopup(auth, google); }
    catch(e){
      if(e.code==='auth/popup-blocked') return Au.signInWithRedirect(auth, google);
      if(e.code!=='auth/popup-closed-by-user' && e.code!=='auth/cancelled-popup-request'){ console.warn(e); alert('Accesso non riuscito ('+e.code+').'); }
    }
  };
  Sync.esci = async ()=>{
    if(!confirm('Uscire da Google? I dati restano su questo dispositivo, ma non si sincronizzano finché non accedi di nuovo.')) return;
    Sync.invia(); await Au.signOut(auth);
  };
  Au.getRedirectResult(auth).catch(e=>console.warn(e));

  let stacca = null, base = null, remoto = {}, fidato = false, pronto = false, timer = null, rimandato = false, forza = false, sceltaAperta = false;
  const leggiBase = ()=>{ try{ return JSON.parse(localStorage.getItem(BKEY)) || null; }catch(e){ return null; } };
  const salvaBase = ()=>{ if(base) try{ localStorage.setItem(BKEY, JSON.stringify(base)); }catch(e){} };
  const segna = (id, h)=>{ if(h==null) delete base[id]; else base[id] = h; };

  Sync.invia = ()=>{ if(timer) riconcilia(); };
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') Sync.invia(); });
  setInterval(()=>{ if(rimandato && !staiScrivendo()) riconcilia(); }, 1500);

  Au.onAuthStateChanged(auth, u=>{
    if(stacca){ stacca(); stacca = null; }
    if(u) return collega(u);
    Sync.stato = 'fuori'; Sync.email = ''; Sync.hook = null; clearTimeout(timer); timer = null;
    if(!Sync.msg) Sync.msg = 'Non sei collegato: i dati restano su questo dispositivo. Premi "Accedi con Google".';
    updateSync();
  });

  function collega(u){
    Object.assign(Sync, {stato:'collegato', email:u.email||'', msg:'', online:false, attesa:0, daCaricare:false});
    base = leggiBase(); remoto = {}; fidato = false; pronto = false;
    Sync.hook = ()=>{ clearTimeout(timer); timer = setTimeout(riconcilia, 700); };
    stacca = F.onSnapshot(F.collection(db, 'archivio'), {includeMetadataChanges: true}, snap=>{
      remoto = {}; let attesa = 0;
      snap.docs.forEach(d=>{ const x = d.data(); if(typeof x.j==='string') remoto[d.id] = x.j; if(d.metadata.hasPendingWrites) attesa++; });
      Sync.online = !snap.metadata.fromCache;
      if(Sync.online) fidato = true; // da qui in poi un documento che manca è stato cancellato davvero
      Sync.attesa = attesa; pronto = true;
      riconcilia();
    }, e=>{
      console.warn(e);
      if(e.code==='permission-denied'){
        Sync.msg = `L'email ${Sync.email} non è ammessa: entra con l'email del presidente o del programmatore.`;
        alert(Sync.msg); Au.signOut(auth);
      } else { Sync.stato = 'fuori'; Sync.msg = 'Sincronizzazione interrotta ('+e.code+'): ricarica la pagina.'; updateSync(); }
    });
    updateSync();
  }

  // "Carica l'archivio su Firebase", "Tieni questo" e "Ripristina da backup": vince questo dispositivo
  Sync.forzaLocale = ()=>{
    if(Sync.stato!=='collegato') return;
    Sync.daCaricare = false;
    if(fidato || base){ base = impronte(remoto); riconcilia(); } else forza = true;
    updateSync(); if(view==='home' && !staiScrivendo()) render();
  };
  Sync.scegli = quale=>{
    closeDlg(); sceltaAperta = false;
    if(quale==='firebase'){
      try{ localStorage.setItem('gareTrota.primaDiFirebase', JSON.stringify(S)); }catch(e){}
      base = impronte(docsArchivio());
    } else base = impronte(remoto);
    riconcilia();
  };
  function primaScelta(){
    Sync.daCaricare = false; updateSync();
    if(sceltaAperta || staiScrivendo()) return;
    sceltaAperta = true;
    let soci = 0; try{ soci = JSON.parse(remoto.soci||'[]').filter(s=>!s.eliminato).length; }catch(e){}
    const gare = Object.keys(remoto).filter(k=>k.indexOf('g_')===0).length;
    openDlg('Archivio già su Firebase', `<p>Su Firebase c'è già un archivio con <b>${soci} soci e ${gare} gare</b>.<br>Su questo dispositivo ce n'è un altro con <b>${sociAttivi().length} soci e ${S.gare.length} gare</b>.</p>
      <p>Quale vuoi tenere? L'altro viene sostituito. Se non sei sicuro, prima scarica una copia di sicurezza.</p>`, null,
      `<button type="button" class="btn primary" onclick="Sync.scegli('firebase')">Usa quello di Firebase</button><button type="button" class="btn" onclick="Sync.scegli('locale')">Tieni questo e caricalo</button><button type="button" class="btn" onclick="doBackup()">Scarica copia di sicurezza</button>`);
    $('#dlg').addEventListener('close', ()=>{ sceltaAperta = false; }, {once: true});
  }

  function riconcilia(){
    clearTimeout(timer); timer = null;
    if(!pronto || Sync.stato!=='collegato') return;
    const locale = docsArchivio();
    if(!base){
      // prima volta su questo dispositivo: si decide solo con Firebase letto dal server
      if(!fidato) return updateSync();
      const nRemoti = Object.keys(remoto).length;
      if(forza){ forza = false; base = impronte(remoto); }
      else if(!nRemoti){
        if(hasData(S) && !Sync.daCaricare){ Sync.daCaricare = true; if(view==='home' && !staiScrivendo()) render(); }
        return updateSync();
      }
      else if(!hasData(S)) base = impronte(locale);   // dispositivo vuoto: prende tutto da Firebase
      else return primaScelta();
    }
    Sync.daCaricare = false;
    const ids = new Set([...Object.keys(locale), ...Object.keys(remoto), ...Object.keys(base)]);
    const daInviare = [], daApplicare = [], scartate = [];
    ids.forEach(id=>{
      const hL = imp(id in locale ? locale[id] : null);
      const hR = id in remoto ? imp(remoto[id]) : fidato ? null : undefined; // undefined = non si sa ancora
      const B = id in base ? base[id] : null;
      if(hR===hL){ segna(id, hL); return; }
      if(hR===undefined){ if(hL!==B) daInviare.push(id); }
      else if(hR===B) daInviare.push(id);      // cambiato qui
      else if(hL===B) daApplicare.push(id);    // cambiato sull'altro dispositivo
      else {                                   // cambiato da tutte e due le parti: vince questo dispositivo,
        daInviare.push(id);                    // la versione dell'altro resta tra le modifiche scartate
        scartate.push({id, quando: new Date().toISOString(), j: remoto[id]});
      }
    });
    if(scartate.length){
      salvaConflitti(leggiConflitti().concat(scartate));
      if(view==='archivio' && !staiScrivendo()) render();
      alert(`Mentre questo dispositivo era senza internet, l'altro ha cambiato gli stessi dati (${scartate.map(c=>nomeDoc(c.id)).join(', ')}). Ho tenuto i dati di questo dispositivo. La versione dell'altro non è persa: la trovi in "Archivio e regolamento", "Modifiche scartate".`);
    }
    if(daInviare.length) inviaDocs(daInviare, locale);
    if(daApplicare.length){
      if(staiScrivendo()) rimandato = true;
      else {
        rimandato = false;
        daApplicare.forEach(id=>{ const R = id in remoto ? remoto[id] : null; applicaDoc(id, R); segna(id, imp(R)); });
        S.savedAt = new Date().toISOString(); saveLocal();
        if(view==='gara' && !gara(viewArg)) view = 'gare';
        if(view==='pesatura' && pes.garaId && !gara(pes.garaId)) pes.garaId = null;
        render();
        toast('Dati aggiornati dall\'altro dispositivo');
      }
    }
    salvaBase(); updateSync();
  }

  function inviaDocs(ids, locale){
    const b = F.writeBatch(db), inviati = [];
    ids.forEach(id=>{
      const L = id in locale ? locale[id] : null, ref = F.doc(db, 'archivio', id);
      if(L==null){ b.delete(ref); delete remoto[id]; }
      else if(new Blob([L]).size > 1000000){ toast('Documento troppo grande per Firebase: '+id); return; }
      else { b.set(ref, {j: L, t: F.serverTimestamp(), da: Sync.email}); remoto[id] = L; }
      segna(id, imp(L)); inviati.push(id);
    });
    // senza rete la promessa aspetta: Firestore tiene le scritture e le manda quando torna internet
    b.commit().catch(e=>{
      console.warn(e); toast('Firebase non ha accettato il salvataggio ('+e.code+')');
      inviati.forEach(id=>{ delete base[id]; }); salvaBase();
    });
  }
}
</script>
